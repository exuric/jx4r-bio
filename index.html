<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>jx4r</title>
<meta name="description" content="jx4r — links" />
<meta property="og:title" content="jx4r" />
<meta property="og:description" content="my corner of the internet" />
<meta property="og:image" content="./avatar.png" />
<link rel="icon" type="image/png" href="./avatar.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<!-- click to enter -->
<div id="enter">
  <div class="enter-box">
    <div class="enter-kicker">EST. 2026</div>
    <div class="enter-title">JX4R<span class="red">.</span></div>
    <div class="enter-hint"><span class="rule"></span>click anywhere to enter<span class="rule"></span></div>
  </div>
</div>

<!-- background -->
<div class="bg" aria-hidden="true"></div>
<div class="bg-tint" aria-hidden="true"></div>
<canvas id="snow" aria-hidden="true"></canvas>
<div id="flash" aria-hidden="true"></div>
<div class="fog" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="themes" id="themes" role="group" aria-label="page theme">
  <button data-t="storm" class="on" title="midnight storm"></button>
  <button data-t="blood" title="blood moon"></button>
  <button data-t="ice" title="ice"></button>
</div>

<main class="wrap">
  <div class="card">
    <div class="avatar-ring">
      <a href="https://discord.com/users/1421349735003983925" target="_blank" rel="noopener" title="open discord profile">
        <img id="avatar" src="./avatar.png" alt="jx4r avatar" />
        <img class="deco" id="deco" src="./deco.png" alt="" aria-hidden="true" hidden />
      </a>
      <span class="status" title="online"></span>
    </div>

    <h1 class="name">jx4r</h1>
    <div class="uid" id="uid" title="click to copy uid">1421349735003983925</div>
    <div class="presence" id="presence">offline</div>
    <div class="typed"><span id="typed"></span><span class="caret">▍</span></div>

    <div class="badges">
      <span class="badge" title="developer">
        <svg viewBox="0 0 24 24" width="13" height="13"><path fill="currentColor" d="m8.7 6.7-5 5 5 5 1.4-1.4-3.6-3.6 3.6-3.6L8.7 6.7zm6.6 0-1.4 1.4 3.6 3.6-3.6 3.6 1.4 1.4 5-5-5-5z"/></svg>
        dev
      </span>
    </div>

    <section id="activity" class="activity" hidden>
      <img id="actArt" alt="" />
      <div class="act-info">
        <div class="act-type" id="actType">playing</div>
        <div class="act-name" id="actName">—</div>
        <div class="act-detail" id="actDetail"></div>
        <div class="bar"><div id="actProg"></div></div>
        <div class="act-time" id="actTime"></div>
      </div>
    </section>

    <nav class="links" id="links"></nav>

    <div class="meta">
      <span class="views" title="profile views">
        <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M12 5c5 0 9.3 3 11 7-1.7 4-6 7-11 7S2.7 16 1 12c1.7-4 6-7 11-7zm0 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0-6.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z"/></svg>
        <b id="viewCount">3608</b>
      </span>
      <span class="dot">•</span>
      <span>est. 2026</span>
    </div>
  </div>

  <div class="live" id="live"><span class="livedot"></span><b id="nowCount">1</b>&nbsp;viewing now</div>

</main>

<section id="admin" class="admin" hidden>
  <h2>views — last 14 days</h2>
  <div id="adminBars" class="bars"></div>
  <div id="adminTotal" class="admin-total"></div>
</section>
<div class="cursor" aria-hidden="true"></div>
<div class="cursor-ring" aria-hidden="true"></div>
<div class="player" id="player" hidden>
  <img id="pArt" src="https://is1-ssl.mzstatic.com/image/thumb/Music123/v4/34/e5/46/34e546b6-94c9-960e-cd35-4f35ffcd6860/19UMGIM71794.rgb.jpg/600x600bb.jpg" alt="Trust Issues cover" />
  <div class="p-info">
    <div class="p-song"><span id="pSong">Trust Issues</span> <span class="plive" id="pLive" hidden>live</span></div>
    <div class="p-artist" id="pArtist">Drake • Care Package</div>
    <div class="bar pbar"><div id="pProg"></div></div>
    <div class="p-meta"><span id="pTime">0:00</span><span>preview</span></div>
  </div>
  <button class="p-toggle" id="pToggle" aria-label="play or pause"></button>
</div>
<audio id="track" src="https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/5b/f2/32/5bf232d1-00ba-f254-213f-3073e0dcd2dd/mzaf_2521671169537775980.plus.aac.p.m4a" loop preload="auto"></audio>
<button class="snd" id="snd" aria-label="toggle rain sound"></button>
<div id="toast"></div>
<script src="./app.js"></script>
</body>
</html>
